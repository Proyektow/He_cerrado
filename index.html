<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090d0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>CERRÉ</title>
  <style>
    :root {
      --bg: #090d0b;
      --surface: #101714;
      --surface-done: #12241b;
      --border: #1e2b24;
      --border-done: #2d5a43;
      --orange: #f97316;
      --green-text: #86efac;
      --text: #e8efe9;
      --muted: #6e8277;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--sans);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 56px;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .brand-text p {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 0.02em;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 11px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-ghost:hover {
      border-color: var(--text);
      color: var(--text);
    }

    .btn-install {
      display: none;
      border-color: var(--orange);
      color: var(--orange);
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 14px;
      min-height: 112px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s ease, border-color 0.15s ease, background-color 0.15s ease;
      user-select: none;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card.done {
      background: var(--surface-done);
      border-color: var(--border-done);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--orange);
    }

    .card.done .status-label {
      color: var(--green-text);
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.75rem;
      opacity: 0.35;
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
    }

    .delete-btn:hover {
      opacity: 1;
      color: var(--orange);
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-top: 14px;
      line-height: 1.25;
    }

    .card-meta {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .card.done .card-meta {
      color: #a3cbb2;
    }

    /* Sections */
    .section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section h2 {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    /* Forms */
    .row {
      display: flex;
      gap: 8px;
    }

    input, select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 10px 12px;
      font-family: var(--sans);
      font-size: 0.86rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus {
      border-color: var(--orange);
    }

    #nameInput, #reminderTarget {
      flex: 1;
      min-width: 0;
    }

    #reminderTime {
      width: 108px;
      font-family: var(--mono);
      font-size: 0.82rem;
    }

    .btn-primary {
      background: var(--orange);
      color: #090d0b;
      border: none;
      border-radius: 6px;
      padding: 0 16px;
      font-family: var(--mono);
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .quick-pills {
      display: flex;
      gap: 6px;
    }

    .pill {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      padding: 5px 10px;
      font-family: var(--mono);
      font-size: 0.72rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .pill:hover {
      border-color: var(--orange);
      color: var(--text);
    }

    /* Lists */
    .list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 170px;
      overflow-y: auto;
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.84rem;
      padding: 6px 0;
      border-bottom: 1px solid rgba(30, 43, 36, 0.55);
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .accent-time {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--orange);
      font-weight: 600;
    }

    .empty-msg {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
    }

    .notif-badge {
      font-family: var(--mono);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 8px;
      border-radius: 4px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
    }

    .notif-badge.active {
      border-color: var(--border-done);
      color: var(--green-text);
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
          <rect width="512" height="512" fill="#090d0b"/>
          <path d="M 344 168 A 124 124 0 1 0 344 344" fill="none" stroke="#e8efe9" stroke-width="54" stroke-linecap="square"/>
          <rect x="244" y="229" width="144" height="54" fill="#f97316"/>
        </svg>
        <div class="brand-text">
          <h1>CERRÉ</h1>
          <p id="summaryText">0 / 4 CONFIRMADOS</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-ghost btn-install" id="installBtn">Instalar</button>
        <button class="btn-ghost" id="resetBtn">Reset</button>
      </div>
    </header>

    <section class="grid" id="grid"></section>

    <form class="row" id="addForm">
      <input type="text" id="nameInput" placeholder="Nuevo control (ej. Ventanas, Gas...)" required />
      <button type="submit" class="btn-primary">Añadir</button>
    </form>

    <section class="section">
      <div class="section-header">
        <h2>Recordatorios</h2>
        <button class="notif-badge" id="notifStatusBtn">Avisos: OFF</button>
      </div>

      <form class="row" id="reminderForm">
        <select id="reminderTarget" aria-label="Elemento a recordar"></select>
        <input type="time" id="reminderTime" required aria-label="Hora del aviso" />
        <button type="submit" class="btn-primary">Fijar</button>
      </form>

      <div class="quick-pills">
        <button type="button" class="pill" data-mins="5">+5m</button>
        <button type="button" class="pill" data-mins="15">+15m</button>
        <button type="button" class="pill" data-mins="30">+30m</button>
        <button type="button" class="pill" data-mins="60">+1h</button>
      </div>

      <ul class="list" id="reminderList"></ul>
    </section>

    <section class="section">
      <div class="section-header">
        <h2>Registro</h2>
        <button class="btn-ghost" id="clearHistoryBtn" style="padding: 3px 8px; font-size: 0.68rem;">Limpiar</button>
      </div>
      <ul class="list" id="historyList"></ul>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "cerre_app_items_v3";
    const HISTORY_KEY = "cerre_app_history_v3";
    const REMINDERS_KEY = "cerre_app_reminders_v3";

    const DEFAULT_ITEMS = [
      { id: "casa", name: "Puerta de casa", checkedAt: null },
      { id: "coche", name: "Puerta del coche", checkedAt: null },
      { id: "basura", name: "Basura sacada", checkedAt: null },
      { id: "fuegos", name: "Vitro / Gas", checkedAt: null }
    ];

    let items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || DEFAULT_ITEMS;
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let reminders = JSON.parse(localStorage.getItem(REMINDERS_KEY)) || [];
    let swReg = null;
    let deferredPrompt = null;

    const grid = document.getElementById("grid");
    const historyList = document.getElementById("historyList");
    const reminderList = document.getElementById("reminderList");
    const reminderTarget = document.getElementById("reminderTarget");
    const reminderTime = document.getElementById("reminderTime");
    const summaryText = document.getElementById("summaryText");
    const notifStatusBtn = document.getElementById("notifStatusBtn");
    const installBtn = document.getElementById("installBtn");

    // --- PWA ---
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          swReg = await navigator.serviceWorker.register("./sw.js");
        } catch (err) {
          console.error("Error registrando SW:", err);
        }
      });
    }

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = "inline-block";
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = "none";
    });

    // --- Notificaciones ---
    function updateNotifUI() {
      if (!("Notification" in window)) {
        notifStatusBtn.textContent = "NO SOPORTADO";
        return;
      }
      if (Notification.permission === "granted") {
        notifStatusBtn.textContent = "AVISOS: ON";
        notifStatusBtn.classList.add("active");
      } else if (Notification.permission === "denied") {
        notifStatusBtn.textContent = "BLOQUEADOS";
        notifStatusBtn.classList.remove("active");
      } else {
        notifStatusBtn.textContent = "AVISOS: OFF";
        notifStatusBtn.classList.remove("active");
      }
    }

    async function ensureNotificationPermission() {
      if (!("Notification" in window)) return false;
      if (Notification.permission === "granted") return true;
      const result = await Notification.requestPermission();
      updateNotifUI();
      return result === "granted";
    }

    notifStatusBtn.addEventListener("click", ensureNotificationPermission);

    async function sendNotification(title, body) {
      if (Notification.permission !== "granted") return;
      const options = {
        body,
        icon: "./icon.svg",
        badge: "./icon.svg",
        vibrate: [120, 60, 120],
        tag: "cerre-reminder"
      };
      if (swReg && swReg.showNotification) {
        swReg.showNotification(title, options);
      } else {
        new Notification(title, options);
      }
    }

    function checkReminders() {
      const now = Date.now();
      let changed = false;

      reminders = reminders.filter((rem) => {
        if (rem.triggerAt <= now) {
          changed = true;
          if (rem.targetId === "ALL") {
            const pending = items.filter((i) => !i.checkedAt);
            if (pending.length > 0) {
              const names = pending.map((p) => p.name).join(", ");
              sendNotification("CERRÉ — Pendientes", `Sin confirmar: ${names}`);
            }
          } else {
            const target = items.find((i) => i.id === rem.targetId);
            if (target && !target.checkedAt) {
              sendNotification("CERRÉ — Recordatorio", `Comprueba: ${target.name}`);
            }
          }
          return false;
        }
        return true;
      });

      if (changed) {
        save();
        renderReminders();
      }
    }

    // --- Persistencia y formato ---
    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      localStorage.setItem(REMINDERS_KEY, JSON.stringify(reminders));
    }

    function formatClock(ts) {
      return new Date(ts).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
    }

    function formatRelative(ts) {
      const diffSec = Math.floor((Date.now() - ts) / 1000);
      if (diffSec < 60) return "ahora";
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `hace ${diffMin}m`;
      const diffHr = Math.floor(diffMin / 60);
      return diffHr < 24 ? `hace ${diffHr}h` : `hace ${Math.floor(diffHr / 24)}d`;
    }

    // --- Acciones ---
    function toggleItem(id) {
      const item = items.find((i) => i.id === id);
      if (!item) return;
      if (navigator.vibrate) navigator.vibrate(20);

      if (item.checkedAt) {
        item.checkedAt = null;
      } else {
        const now = Date.now();
        item.checkedAt = now;
        history.unshift({ text: item.name, time: now });
        if (history.length > 20) history.pop();
      }
      save();
      render();
    }

    function deleteItem(e, id) {
      e.stopPropagation();
      items = items.filter((i) => i.id !== id);
      reminders = reminders.filter((r) => r.targetId !== id);
      save();
      render();
    }

    async function scheduleReminder(targetId, triggerAt) {
      const ok = await ensureNotificationPermission();
      if (!ok) {
        alert("Activa los permisos de notificación para programar recordatorios.");
        return;
      }
      const label =
        targetId === "ALL"
          ? "Todo lo pendiente"
          : (() => {
              const it = items.find((i) => i.id === targetId);
              return it ? it.name : "Recordatorio";
            })();

      reminders.push({
        id: String(Date.now() + Math.random()),
        targetId,
        label,
        triggerAt
      });
      reminders.sort((a, b) => a.triggerAt - b.triggerAt);
      save();
      renderReminders();
    }

    // --- Render ---
    function renderReminders() {
      reminderList.innerHTML = "";
      if (reminders.length === 0) {
        reminderList.innerHTML = `<li class="empty-msg">Sin avisos activos.</li>`;
        return;
      }
      reminders.forEach((rem) => {
        const li = document.createElement("li");
        li.className = "list-item";
        li.innerHTML = `
          <span>${rem.label}</span>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="accent-time">${formatClock(rem.triggerAt)}</span>
            <button class="btn-ghost" style="padding:2px 6px;font-size:0.68rem;" aria-label="Borrar">X</button>
          </div>
        `;
        li.querySelector("button").onclick = () => {
          reminders = reminders.filter((r) => r.id !== rem.id);
          save();
          renderReminders();
        };
        reminderList.appendChild(li);
      });
    }

    function render() {
      const doneCount = items.filter((i) => i.checkedAt).length;
      summaryText.textContent =
        doneCount === items.length && items.length > 0
          ? "TODO CONFIRMADO"
          : `${doneCount} / ${items.length} CONFIRMADOS`;

      grid.innerHTML = "";
      items.forEach((item) => {
        const card = document.createElement("div");
        card.className = `card ${item.checkedAt ? "done" : ""}`;
        card.onclick = () => toggleItem(item.id);

        const statusText = item.checkedAt ? "OK" : "PENDIENTE";
        const metaText = item.checkedAt
          ? `${formatClock(item.checkedAt)} · ${formatRelative(item.checkedAt)}`
          : "Sin confirmar";

        card.innerHTML = `
          <div class="card-top">
            <span class="status-label">${statusText}</span>
            <button class="delete-btn" title="Eliminar" aria-label="Eliminar">X</button>
          </div>
          <div>
            <div class="card-title">${item.name}</div>
            <div class="card-meta">${metaText}</div>
          </div>
        `;
        card.querySelector(".delete-btn").onclick = (e) => deleteItem(e, item.id);
        grid.appendChild(card);
      });

      const currentVal = reminderTarget.value;
      reminderTarget.innerHTML = `<option value="ALL">Todo lo pendiente</option>`;
      items.forEach((item) => {
        const opt = document.createElement("option");
        opt.value = item.id;
        opt.textContent = item.name;
        reminderTarget.appendChild(opt);
      });
      if ([...reminderTarget.options].some((o) => o.value === currentVal)) {
        reminderTarget.value = currentVal;
      }

      historyList.innerHTML = "";
      if (history.length === 0) {
        historyList.innerHTML = `<li class="empty-msg">Sin registros.</li>`;
      } else {
        history.forEach((entry) => {
          const li = document.createElement("li");
          li.className = "list-item";
          li.innerHTML = `
            <span>${entry.text}</span>
            <span class="accent-time">${formatClock(entry.time)}</span>
          `;
          historyList.appendChild(li);
        });
      }

      renderReminders();
    }

    // --- Eventos ---
    document.getElementById("addForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const nameInput = document.getElementById("nameInput");
      const name = nameInput.value.trim();
      if (!name) return;

      items.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        name,
        checkedAt: null
      });
      nameInput.value = "";
      save();
      render();
    });

    document.getElementById("reminderForm").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!reminderTime.value) return;
      const [h, m] = reminderTime.value.split(":").map(Number);
      const target = new Date();
      target.setHours(h, m, 0, 0);
      if (target.getTime() <= Date.now()) {
        target.setDate(target.getDate() + 1);
      }
      scheduleReminder(reminderTarget.value, target.getTime());
    });

    document.querySelectorAll(".pill").forEach((btn) => {
      btn.addEventListener("click", () => {
        const mins = Number(btn.dataset.mins);
        scheduleReminder(reminderTarget.value, Date.now() + mins * 60 * 1000);
      });
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      items.forEach((i) => (i.checkedAt = null));
      save();
      render();
    });

    document.getElementById("clearHistoryBtn").addEventListener("click", () => {
      history = [];
      save();
      render();
    });

    setInterval(checkReminders, 10000);
    setInterval(render, 30000);
    updateNotifUI();
    render();
  </script>
</body>
</html>
